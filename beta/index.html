<!doctype html>
<html lang="en" data-theme="oat">
<head>
  <meta charset="utf-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plate test</title>
  <meta name="description" content="A calm, private calorie, water and vitamin tracker.">
  <meta name="theme-color" content="#F2EEE6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Plate">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..650&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint so there's no flash.
    (function () {
      var t = 'oat';
      try { t = localStorage.getItem('plate-beta-theme') || 'oat'; } catch (e) {}
      var colors = { oat: '#F2EEE6', midnight: '#0A0B0D', porcelain: '#F6F6F7' };
      if (!colors[t]) t = 'oat';
      document.documentElement.setAttribute('data-theme', t);
      document.querySelector('meta[name=theme-color]').setAttribute('content', colors[t]);
      if (t === 'midnight') document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]').setAttribute('content', 'black-translucent');
    })();
  </script>
  <script>window.PLATE_SERVER = 'https://plate-api.mreuvenaronov.workers.dev'; window.PLATE_DB = 'plate-beta'; // real AI through the Plate server, separate storage</script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="root"><div class="boot"></div></div>
  <noscript>Plate needs JavaScript to run.</noscript>
</body>
</html>
